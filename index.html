<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Bachha</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #fff5f7; color: #4a4a4a; font-family: 'Playfair Display', serif; overflow-x: hidden; text-align: center; }

        /* HEARTS - MOVED TO THE VERY BACK */
        .heart-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -10; overflow: hidden; }
        .heart { position: absolute; top: -20px; font-size: 25px; color: #ff8fa3; opacity: 0.6; animation: fall 7s linear forwards; }
        @keyframes fall { to { transform: translateY(105vh) rotate(360deg); } }

        /* COVER PAGE */
        #cover-page {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff; z-index: 2000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        /* MAIN APP WRAPPER */
        #main-content { display: none; opacity: 0; transition: opacity 1.5s ease; position: relative; z-index: 10; }

        .container { 
            max-width: 850px; margin: 40px auto; background: rgba(255, 255, 255, 0.98); 
            padding: 60px 40px; border-radius: 30px; box-shadow: 0 20px 60px rgba(214, 51, 108, 0.1); 
            position: relative; z-index: 20;
        }

        h1 { font-family: 'Great Vibes', cursive; color: #c2185b; font-size: 4rem; margin-bottom: 10px; }
        .letter-text { text-align: left; font-size: 1.7rem; line-height: 1.8; font-family: 'Great Vibes', cursive; white-space: pre-wrap; margin: 30px 0; }

        /* GALLERY GRID - PORTRAIT FOCUS */
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; padding: 20px 0; }
        
        .gallery-item { 
            background: white; border-radius: 15px; overflow: hidden; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            cursor: pointer; 
            transition: transform 0.3s ease;
            position: relative;
            z-index: 50; /* Ensuring items are above containers */
        }
        .gallery-item:hover { transform: translateY(-10px); }
        .gallery-item img, .gallery-item video { width: 100%; height: 450px; object-fit: cover; display: block; pointer-events: none; }

        /* LIGHTBOX OVERLAY */
        #lightbox {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 3000;
            display: none; justify-content: center; align-items: center;
        }
        #lightbox-content { max-width: 90%; max-height: 85%; border-radius: 10px; pointer-events: auto; }
        .close-btn { position: absolute; top: 20px; right: 30px; color: #fff; font-size: 50px; cursor: pointer; z-index: 3001; }

        .btn { padding: 18px 45px; background: linear-gradient(135deg, #d6336c, #ff758c); color: white; border: none; border-radius: 50px; font-weight: 700; cursor: pointer; margin-top: 20px; font-family: 'Playfair Display', serif; position: relative; z-index: 60; }
        input { width: 80%; padding: 15px; border-radius: 10px; border: 1px solid #ffd1dc; text-align: center; margin: 20px 0; font-size: 1.2rem; }
    </style>
</head>
<body onclick="playMusicOnFirstClick()">

    <audio id="bg-music" loop><source src="music.mp3" type="audio/mpeg"></audio>

    <div id="cover-page">
        <h1 style="font-size: 3rem;">For My Favorite Person</h1>
        <button class="btn" onclick="startExperience()">Open Your Surprise</button>
    </div>

    <div id="main-content">
        <div class="heart-bg" id="hearts"></div>
        <div class="container" id="section-letter">
            <h1>Happy Valentine’s Day</h1>
            <div class="letter-text">
My love,
... (Your full letter here) ...
            </div>
            <button class="btn" onclick="showPassword()">I have one last question...</button>
        </div>

        <div id="section-password" style="display:none;">
            <div class="container">
                <h2 style="font-family: 'Playfair Display';">Who is my favorite footballer?</h2>
                <input type="text" id="pass-field" placeholder="Hint: Look in the mirror">
                <br>
                <button class="btn" onclick="checkPassword()">Unlock Memories</button>
            </div>
        </div>

        <div id="section-collage" style="display:none;">
            <div class="container" style="max-width: 1100px;">
                <h1>Our Memories</h1>
                <p style="margin-bottom: 20px; font-style: italic;">Click any memory to see it full screen</p>
                <div class="gallery-grid">
                    <div class="gallery-item" onclick="expand(this)"><img src="photo1.jpg"></div>
                    <div class="gallery-item" onclick="expand(this)"><img src="photo2.jpg"></div>
                    <div class="gallery-item" onclick="expand(this)"><img src="photo3.jpg"></div>
                    <div class="gallery-item" onclick="expand(this)"><img src="photo4.jpg"></div>
                    <div class="gallery-item" onclick="expand(this)"><img src="photo5.jpg"></div>
                    <div class="gallery-item" onclick="expand(this)"><img src="photo6.jpg"></div>
                    <div class="gallery-item" onclick="expand(this)"><video src="video1.mp4"></video></div>
                    <div class="gallery-item" onclick="expand(this)"><video src="video2.mp4"></video></div>
                    <div class="gallery-item" onclick="expand(this)"><video src="video3.mp4"></video></div>
                    <div class="gallery-item" onclick="expand(this)"><video src="video4.mp4"></video></div>
                    <div class="gallery-item" onclick="expand(this)"><video src="video5.mp4"></video></div>
                    <div class="gallery-item" onclick="expand(this)"><video src="video6.mp4"></video></div>
                </div>
            </div>
        </div>
    </div>

    <div id="lightbox" onclick="closeLightbox()">
        <span class="close-btn" onclick="closeLightbox()">&times;</span>
        <div id="lightbox-target"></div>
    </div>

    <script>
        function playMusicOnFirstClick() {
            document.getElementById('bg-music').play().catch(() => {});
        }

        function startExperience() {
            document.getElementById('bg-music').play();
            document.getElementById('cover-page').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('cover-page').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                setTimeout(() => { document.getElementById('main-content').style.opacity = '1'; }, 10);
                setInterval(makeHeart, 500);
            }, 1000);
        }

        function expand(el) {
            const lightbox = document.getElementById('lightbox');
            const target = document.getElementById('lightbox-target');
            const media = el.querySelector('img, video').cloneNode(true);
            
            if (media.tagName === 'VIDEO') {
                media.controls = true;
                media.play();
            }
            
            target.innerHTML = '';
            target.appendChild(media);
            media.id = "lightbox-content";
            lightbox.style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
            document.getElementById('lightbox-target').innerHTML = '';
        }

        function makeHeart() {
            const h = document.createElement('div');
            h.classList.add('heart'); h.innerHTML = '❤️';
            h.style.left = Math.random() * 100 + "vw";
            h.style.animationDuration = (Math.random() * 3 + 5) + "s";
            document.getElementById('hearts').appendChild(h);
            setTimeout(() => h.remove(), 7000);
        }

        function showPassword() {
            document.getElementById('section-letter').style.display = 'none';
            document.getElementById('section-password').style.display = 'block';
        }

        function checkPassword() {
            if (document.getElementById('pass-field').value.toLowerCase().trim() === 'you') {
                document.getElementById('section-password').style.display = 'none';
                document.getElementById('section-collage').style.display = 'block';
            }
        }
    </script>
</body>
</html>
