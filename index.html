<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Bachha</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #fff5f7; color: #4a4a4a; font-family: 'Playfair Display', serif; overflow-x: hidden; text-align: center; }

        /* COVER PAGE - This forces the click needed for music */
        #cover-page {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; z-index: 1000; display: flex;
            flex-direction: column; justify-content: center; align-items: center;
        }

        .heart-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; overflow: hidden; }
        .heart { position: absolute; top: -20px; font-size: 25px; color: #ff8fa3; opacity: 0.6; animation: fall 7s linear forwards; }
        @keyframes fall { to { transform: translateY(105vh) rotate(360deg); } }

        .container { max-width: 800px; margin: 60px auto; background: rgba(255, 255, 255, 0.95); padding: 70px 50px; border-radius: 30px; box-shadow: 0 20px 60px rgba(214, 51, 108, 0.15); position: relative; z-index: 5; }
        h1 { font-family: 'Great Vibes', cursive; color: #c2185b; font-size: 4.5rem; margin-bottom: 10px; }
        .letter-text { text-align: left; font-size: 1.8rem; color: #333; margin-bottom: 40px; white-space: pre-wrap; line-height: 1.8; font-family: 'Great Vibes', cursive; }
        
        .btn { display: inline-block; padding: 20px 50px; background: linear-gradient(135deg, #d6336c, #ff758c); color: white; border: none; border-radius: 60px; font-family: 'Playfair Display', serif; font-weight: 700; font-size: 1.1rem; cursor: pointer; box-shadow: 0 10px 25px rgba(214, 51, 108, 0.4); transition: all 0.3s ease; }
        
        #main-content { display: none; }
        .slideshow-container { width: 100%; height: 500px; margin-bottom: 50px; border-radius: 20px; overflow: hidden; background-color: #000; }
        .mySlides { display: none; height: 100%; width: 100%; }
        .mySlides img { width: 100%; height: 100%; object-fit: contain; }
    </style>
</head>
<body>

    <audio id="bg-music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <div id="cover-page">
        <h1 style="font-size: 3.5rem;">For My Favorite Person</h1>
        <p style="font-style: italic; margin-bottom: 30px; color: #888;">Turn up your volume...</p>
        <button class="btn" onclick="startExperience()">Open Your Surprise</button>
    </div>

    <div id="main-content">
        <div class="heart-bg" id="hearts"></div>
        <div class="container">
            <h1>Happy Valentine’s Day</h1>
            <div class="slideshow-container">
                <div class="mySlides fade" style="display:block;"><img src="photo1.jpg"></div>
                <div class="mySlides fade"><img src="photo2.jpg"></div>
                <div class="mySlides fade"><img src="photo3.jpg"></div>
                </div>
            <div class="letter-text">
My love,
... (Your full letter here) ...
            </div>
            <p style="font-family: 'Great Vibes'; font-size: 2.5rem; color: #c2185b;">Forever yours bachha,<br>Ethan</p>
        </div>
    </div>

    <script>
        function startExperience() {
            var music = document.getElementById('bg-music');
            music.play(); // This works now because the user clicked the button
            document.getElementById('cover-page').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            runSlides();
            setInterval(makeHeart, 500);
        }

        let sIndex = 0;
        function runSlides() {
            let slides = document.getElementsByClassName("mySlides");
            for (let i = 0; i < slides.length; i++) { slides[i].style.display = "none"; }
            sIndex++;
            if (sIndex > slides.length) { sIndex = 1; }
            slides[sIndex-1].style.display = "block";
            setTimeout(runSlides, 3500);
        }

        function makeHeart() {
            const h = document.createElement('div');
            h.classList.add('heart'); h.innerHTML = '❤️';
            h.style.left = Math.random() * 100 + "vw";
            h.style.animationDuration = (Math.random() * 3 + 5) + "s";
            document.getElementById('hearts').appendChild(h);
            setTimeout(() => h.remove(), 7000);
        }
    </script>
</body>
</html>
